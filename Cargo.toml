[package]
name = "gsm_map"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "GSM MAP (Mobile Application Part) operations per 3GPP TS 29.002 — SMS (MO/MT-ForwardSM, SRI-for-SM), mobility, authentication, USSD, supplementary services, and CAMEL/CAP — as BER-codable ASN.1 types"
authors = ["Real Time Telecom B.V."]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Real-Time-Telecom-B-V/gsm_map"
homepage = "https://github.com/Real-Time-Telecom-B-V/gsm_map"
keywords = ["gsm", "map", "ss7", "3gpp", "sms"]
categories = ["network-programming"]
exclude = [".github/", "docs/"]

[dependencies]
rasn = "0.28"
hex = "0.4"
thiserror = "2"
tcap = { git = "https://github.com/Real-Time-Telecom-B-V/tcap", branch = "main" }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
