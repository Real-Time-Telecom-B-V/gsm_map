# .github/workflows/ci.yml — gsm_map CI
#
# Two stories from one source tree:
#   * Rust crate (crates.io): default build is pyo3-free.
#   * Python wheel (PyPI):    the `python` feature adds the PyO3 bindings for the
#     GSM MAP SMS operation set.
#
# IMPORTANT: never use `--all-features`. That would enable `extension-module`,
# which tells pyo3 NOT to link libpython and so breaks any Rust test binary.
# `extension-module` is set only by maturin (the wheel build). We test the
# pyo3-free default AND `--features python` (which links libpython) separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    # Pinned, not `ubuntu-latest`, because the Wireshark cross-check below needs a
    # dissector whose compiled TS 29.002 is at least as new as the spec revision the
    # vectors target. 24.04 ships tshark 4.2.2, which predates several members the
    # vectors assert and fails frames the encoder gets right; 26.04 ships 4.6.4.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # libpython for the `--features python` build/link (abi3 still links libpython
      # for a non-extension-module test binary).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format
        run: cargo fmt --all -- --check

      # Lint both faces of the crate. Clippy honours [lints.clippy] in Cargo.toml
      # (correctness denied).
      - name: Clippy (pyo3-free)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (python feature)
        run: cargo clippy --features python --lib -- -D warnings

      - name: Test (pyo3-free)
        run: cargo test

      - name: Test (python feature)
        run: cargo test --features python

      # Keep the benchmarks compiling — including the full-stack MAP ▸ TCAP ▸ SCCP
      # integration bench (pulls the sibling sccp dev-dep).
      - name: Benches compile
        run: cargo bench --no-run

      # Deterministic counting-allocator leak gate (codec + full-stack churn).
      - name: Memory-leak check
        run: cargo run --release --example leak_check

      # A BER round-trip cannot catch a tag that is wrong in both directions, so
      # the vectors also go past an independent decoder. tshark only reads a file
      # here, so it needs no capture privileges; the debconf answer just keeps
      # the install non-interactive. The script hard-fails below Wireshark 4.6
      # rather than reporting an old dissector's gaps as encoder bugs.
      - name: Install Wireshark CLI tools
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark

      - name: Wireshark cross-check
        run: ./scripts/wireshark_check.sh

  # Build the wheel and run the Python parity suite.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build extension (maturin develop)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop

      - name: Import smoke
        run: . .venv/bin/activate && python -c "import gsm_map; print(gsm_map.__version__)"

      - name: pytest
        run: . .venv/bin/activate && pytest python/tests -q

  # Free-threaded ("no-GIL") smoke. pyo3 >= 0.28 declares gil_used=false, so the
  # module must import and run without re-enabling the GIL.
  # Gating: free-threaded CPython is available on the runners, so a failure here
  # is a real failure rather than a toolchain gap.
  python-freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"

      - name: Build + test on free-threaded CPython
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop --release
          python -c "import sys, gsm_map; assert sys._is_gil_enabled() is False; print('no-GIL OK', gsm_map.__version__)"
          pytest python/tests -q
