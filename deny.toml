# cargo-deny — dependency-graph security / license / source policy for gsm_map.
# Local: `cargo deny check`  ·  CI: .github/workflows/audit.yml
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
# A yanked crate or an open RustSec advisory fails the audit.
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
# gsm_map's runtime deps are rasn (ASN.1 BER), hex, thiserror, and tcap; the
# optional `python` feature adds pyo3 (the Rust-backed wheel). No C libraries are
# linked in the default build, so there is no C-FFI ban list.

[licenses]
# The crate is MIT; keep dependencies OSI-permissive.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `tcap` (runtime) and `sccp` (dev-only, used by the full-stack MAP ▸ TCAP ▸ SCCP
# integration bench) are sibling crates consumed as git dependencies until
# they are published to crates.io; allow those sources explicitly.
allow-git = [
    "https://github.com/Real-Time-Telecom-B-V/tcap",
    "https://github.com/Real-Time-Telecom-B-V/sccp",
]
